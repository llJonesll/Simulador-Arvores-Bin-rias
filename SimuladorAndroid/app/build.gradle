plugins {
    id 'com.android.application'
}

android {
    namespace 'simulador'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.davidbuzatto.simuladorarvores"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // JDK 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// O aplicativo não usa nenhuma biblioteca externa (nem AndroidX): só o SDK do Android.
dependencies {
}
